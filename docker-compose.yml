# Video agent on a VPS (outside RU — the Claude API is not available from Russia).
#   cp .env.example .env   # fill in tokens
#   docker compose up -d --build
services:
  telegram-bot-api:          # self-hosted Bot API: files up to 2 GB instead of 20 MB
    image: aiogram/telegram-bot-api:latest
    restart: unless-stopped
    environment:
      TELEGRAM_API_ID: ${TELEGRAM_API_ID}
      TELEGRAM_API_HASH: ${TELEGRAM_API_HASH}
      TELEGRAM_LOCAL: "1"
    volumes:
      - tg-data:/var/lib/telegram-bot-api

  agent:
    build: {context: ., dockerfile: Dockerfile.agent}
    restart: unless-stopped
    depends_on: [telegram-bot-api]
    env_file: .env
    environment:
      BOT_API_URL: http://telegram-bot-api:8081
    volumes:
      - tg-data:/var/lib/telegram-bot-api   # same path as in the Bot API container: local file access
      - ./work:/app/work
      - ./out:/app/out
      - ./public/agent:/app/public/agent

volumes:
  tg-data:
