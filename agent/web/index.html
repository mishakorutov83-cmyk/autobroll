<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Монтажёр</title>
<meta name="description" content="Видео-агент: монтаж по шаблону и варианты роликов">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Монтажёр">
<meta name="theme-color" content="#0f1012">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" href="icon-192.png">
<link rel="manifest" href="manifest.webmanifest">
<link rel="stylesheet" href="style.css">
</head>
<body>
<header class="bar">
  <button id="back" class="icon-btn" hidden aria-label="Назад">‹</button>
  <h1 id="title">Монтажёр</h1>
  <span class="spacer"></span>
  <button id="logout" class="link-btn" hidden>Выйти</button>
</header>
<main id="app" aria-live="polite">
  <div class="card" id="boot"><h2>Загружаю…</h2>
    <p class="muted">Если эта надпись не исчезает, потяните страницу вниз для обновления. Проверка связи: добавьте к адресу /health — должно появиться «ok».</p></div>
</main>
<noscript><div style="padding:16px">Для работы приложения нужен JavaScript — включите его в настройках Safari.</div></noscript>
<script>
// a script that fails to start (old Safari, a half-loaded page) must say so instead of leaving a blank screen
window.addEventListener('error', function (e) {
  var a = document.getElementById('app');
  if (!a || (e.target && e.target !== window && e.target.tagName !== 'SCRIPT')) return;
  var m = String(e.message || 'не загрузился app.js').replace(/</g, '&lt;');
  a.innerHTML = '<div class="card error">Скрипт страницы не запустился: ' + m + ' (' + String(e.filename || '').split('/').pop() + ':' + (e.lineno || 0) +
    ').<br><br>Обновите страницу. Если повторяется — пришлите этот текст и версию iOS.</div>';
}, true);
</script>
<div id="toast" role="status" hidden></div>
<script src="app.js"></script>
</body>
</html>
