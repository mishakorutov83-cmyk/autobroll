# Template: живой ролик эксперта-стилиста — шоурум / магазин / салон, разговор в камеру.
# Собран по 5 роликам-образцам (work/train: шоурум с костюмом, шопинг-влог, красный пуховик,
# салон в Китае, шуба). Шаблон фиксирует СТИЛЬ и правила; историю агент строит заново под каждый ролик.
name: live_showroom
description: Живой разговор в камеру в шоуруме или магазине — эмоция, детали вещи крупно, личная история, цена или вывод в конце.

# Measured on the examples: 24–120 s, −14 LUFS, no music, no headline plates, small white captions.
length: [30, 90]
speed: 1.05            # she already talks fast — only tighten a little

structure:
  - cold_open: >
      0–3 с. Начинать сразу с живой фразы — с середины мысли, без «привет» и «сегодня я покажу».
      Образцы: провокация («Я говорю: о, ВБ пошло!»), риторический вопрос («За что я люблю Китай?»),
      эмоция («Это что за сумасшедшие модели, а?»), обращение («Девочки, хочу показать вам изнанку»). Лицо в кадре.
  - show: >
      Вещь на ней или в руках, голос не прерывается. Под слова о деталях — крупные планы
      деталей (ткань, молния, подкладка, капюшон, шлёвки, изнанка), если они есть в исходнике.
  - story: >
      Личная история или эмоция, если она есть (воспоминание, «девочки», сравнение «раньше / сейчас»).
      Это сердце ролика — не вырезать живые интонации, смех, обращения к зрителю.
  - point: >
      Вывод или ценность одной фразой («всегда встречают по одежке», «тут есть грация»).
  - price_or_cta: >
      Если в исходнике звучит цена — закончить ею («Лапочки мои, по цене этот пуховик стоит 48 250»);
      цену в юанях оставлять вместе с пересчётом («158 юаней… чуть больше 2000 рублей»).
      Иначе — тёплая живая финальная реплика («Как это красиво, девочки», «До встречи»). Никаких end card.
      Хвост после цены (переговоры с продавцами, обрывки цифр) — вырезать.

cutting:
  style: jump-cuts        # монтаж «в склейку»: вырезать паузы, «эээ», повторы, переходы, но не дробить мысль
  avg_shot: 10.0          # смена крупности не чаще ~раз в 8–12 с; во влог-формате (разные места) 3–5 с
  shot_sizes: {N: 1.0, M: 1.08, C: 1.16}   # почти без цифрового зума — исходник снят вплотную
  remove: [паузы, повторы, оговорки, проводки камеры без смысла, грубый мат, разговоры с продавцами не по теме,
           галлюцинации распознавания («Субтитры сделал …», «Продолжение следует»)]
  slang: лёгкий сленг («нефиг», «кайфанёшь», «до хрена») — её голос, оставлять
  keep_person: true
  pip: >
    Если она рассказывает о процессе или услуге, а в исходнике есть кадр этого процесса —
    insert mode=pip (окно справа), чтобы её лицо оставалось в кадре.

captions:
  preset: plain           # белый текст Inter, без плашки и цветных акцентов, фраза целиком
  max_chars: 38
  accent: "#FFFFFF"
  top: 72                 # ниже груди, выше интерфейса Reels
  accents_per_clip: 0     # акцентируются автоматически только цифры и цены (крупнее, жирнее)
  text: >
    Разговорный текст как есть, без точек в конце фраз; ? и ! оставлять. Имена, бренды и магазины —
    правильно (ВБ, Озон, SHIK, Гуанчжоу). Можно одно эмодзи на ролик, если оно к месту (🤍).

overlays:
  hook_headline: false
  item_labels: false

end_card: null
music: none

variants:
  allowed: [первая фраза, порядок блоков, длина, высота субтитров, крупности]
  forbidden: [заголовки-плашки, цветные акценты, музыка]   # в её стиле этого нет
